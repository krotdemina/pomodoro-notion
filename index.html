<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #4a3b32;
      --card: #3a2e27;
      --accent: #8c6d58;
      --text: #f4eae1;
      --active: #d9ab7e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    .widget {
      background: var(--card);
      border-radius: 12px;
      padding: 12px 16px;
      width: 240px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .modes {
      display: flex;
      justify-content: space-between;
      gap: 4px;
      margin-bottom: 8px;
    }

    .modes button {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--text);
      border-radius: 6px;
      padding: 3px 6px;
      font-size: 0.75rem;
      cursor: pointer;
      flex: 1;
    }

    .modes button.active {
      background: var(--active);
      color: var(--card);
      border-color: var(--active);
      font-weight: bold;
    }

    .timer {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin: 4px 0;
      font-variant-numeric: tabular-nums;
    }

    .gif-container {
      height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 4px 0;
    }

    .gif-container img {
      height: 100%;
      object-fit: contain;
      display: none;
    }

    .controls button {
      background: var(--active);
      color: var(--card);
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="widget">
    <div class="modes">
      <button id="study" class="active" onclick="setMode('study')">Study</button>
      <button id="short" onclick="setMode('short')">Short</button>
      <button id="long" onclick="setMode('long')">Long</button>
    </div>

    <div class="timer" id="timer">25:00</div>

    <div class="gif-container">
      <!-- GIF de Marie qui dort (remplaçable par ton propre lien si besoin) -->
      <img id="marie" src="https://media.giphy.com/media/3oKIPa2TdahY8LAAxy/giphy.gif" alt="Marie dort">
    </div>

    <div class="controls">
      <button id="start" onclick="toggleTimer()">Start</button>
    </div>
  </div>

  <script>
    const times = { study: 25 * 60, short: 5 * 60, long: 15 * 60 };
    let currentMode = 'study';
    let timeLeft = times[currentMode];
    let timerId = null;

    const img = document.getElementById('marie');
    const startBtn = document.getElementById('start');

    function updateDisplay() {
      const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
      const s = String(timeLeft % 60).padStart(2, '0');
      document.getElementById('timer').textContent = `${m}:${s}`;
    }

    function setMode(mode) {
      stopTimer();
      currentMode = mode;
      timeLeft = times[mode];
      document.querySelectorAll('.modes button').forEach(b => b.classList.remove('active'));
      document.getElementById(mode).classList.add('active');
      updateDisplay();
    }

    function stopTimer() {
      clearInterval(timerId);
      timerId = null;
      startBtn.textContent = 'Start';
      img.style.display = 'none';
    }

    function toggleTimer() {
      if (timerId) {
        stopTimer();
      } else {
        img.style.display = 'block';
        startBtn.textContent = 'Pause';
        timerId = setInterval(() => {
          if (timeLeft > 0) {
            timeLeft--;
            updateDisplay();
          } else {
            stopTimer();
          }
        }, 1000);
      }
    }
  </script>
</body>
</html>
