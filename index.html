<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #4a3b32;
      --card: #3a2e27;
      --accent: #8c6d58;
      --text: #f4eae1;
      --active: #d9ab7e;
      --btn-hover: #c49669;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    .widget {
      background: var(--card);
      border-radius: 14px;
      padding: 14px 16px;
      width: 250px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .modes {
      display: flex;
      justify-content: space-between;
      gap: 4px;
      margin-bottom: 10px;
    }

    .modes button {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--text);
      border-radius: 8px;
      padding: 4px 6px;
      font-size: 0.75rem;
      cursor: pointer;
      flex: 1;
      transition: all 0.2s ease;
    }

    .modes button.active {
      background: var(--active);
      color: var(--card);
      border-color: var(--active);
      font-weight: bold;
    }

    .timer {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin: 4px 0;
      font-variant-numeric: tabular-nums;
      color: #fff8f0;
    }

    .image-container {
      height: 90px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 6px 0 10px 0;
      position: relative;
    }

    .image-container img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
      image-rendering: pixelated; /* Conserve le style Pixel Art net */
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .controls button {
      background: var(--active);
      color: var(--card);
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      flex: 1;
      transition: background 0.2s;
    }

    .controls button:hover {
      background: var(--btn-hover);
    }

    .controls button.secondary {
      background: var(--accent);
      color: var(--text);
    }

    .controls button.secondary:hover {
      background: #7a5e4b;
    }
  </style>
</head>
<body>

  <div class="widget">
    <div class="modes">
      <button id="study" class="active" onclick="setMode('study')">Study</button>
      <button id="short" onclick="setMode('short')">Short</button>
      <button id="long" onclick="setMode('long')">Long</button>
    </div>

    <div class="timer" id="timer">25:00</div>

    <div class="image-container">
      <!-- Image Pixel Art de Marie qui dort à son bureau (style Nook Office) -->
      <img id="marie" src="https://raw.githubusercontent.com/vijiatjack/nookoffice/main/assets/isabelle-sleeping.png" 
           onerror="this.src='https://acnhapi.com/v1/images/villagers/1'" 
           alt="Marie qui dort">
    </div>

    <div class="controls">
      <button id="startBtn" onclick="startTimer()">Start</button>
      <button id="pauseBtn" class="secondary" onclick="pauseTimer()">Pause</button>
      <button id="resetBtn" class="secondary" onclick="resetTimer()">Reset</button>
    </div>
  </div>

  <script>
    const times = { study: 25 * 60, short: 5 * 60, long: 15 * 60 };
    let currentMode = 'study';
    let timeLeft = times[currentMode];
    let timerId = null;

    function updateDisplay() {
      const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
      const s = String(timeLeft % 60).padStart(2, '0');
      document.getElementById('timer').textContent = `${m}:${s}`;
    }

    function setMode(mode) {
      pauseTimer();
      currentMode = mode;
      timeLeft = times[mode];
      document.querySelectorAll('.modes button').forEach(b => b.classList.remove('active'));
      document.getElementById(mode).classList.add('active');
      updateDisplay();
    }

    function startTimer() {
      if (timerId) return; // Déjà en train de tourner
      
      timerId = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          updateDisplay();
        } else {
          pauseTimer();
          alert('Temps écoulé !');
        }
      }, 1000);
    }

    function pauseTimer() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
    }

    function resetTimer() {
      pauseTimer();
      timeLeft = times[currentMode];
      updateDisplay();
    }

    // Initialisation au chargement
    updateDisplay();
  </script>
</body>
</html>
